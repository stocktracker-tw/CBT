    left = 300;
  };
  box.querySelector('#fm-done').addEventListener('click', () => { credit(); toast('做到了就算數——已記入你的成就清單'); });
  goBtn.addEventListener('click', () => {
    if (running) { clearActiveTimer(); running = false; goBtn.textContent = '繼續'; return; }
    running = true; goBtn.textContent = '暫停';
    clearActiveTimer();
    activeTimer = setInterval(() => {
      left--; draw();
      if (left <= 0) {
        credit();
        toast('五分鐘做到了——已記入你的成就清單');
      }
    }, 1000);
  });
  box.querySelector('#fm-reset').addEventListener('click', () => { clearActiveTimer(); running = false; left = 300; draw(); goBtn.textContent = '開始'; });
}

/* ================= HISTORY view ================= */
let chartMode = 'chart';
renderers.history = function () {
  const v = $('#view-history');
  const totalDays = Object.keys(D.checkins).length;
  let html = '<h1 class="page-title">紀錄</h1><p class="page-sub">改變常常小到當下感覺不到，讓數字替你留下證據</p>' +
    '<div class="stat-tiles">' +
    '<div class="stat-tile"><div class="n">' + streakCount() + '</div><div class="l">連續天數</div></div>' +
    '<div class="stat-tile"><div class="n">' + totalDays + '</div><div class="l">簽到天數</div></div>' +
    '<div class="stat-tile"><div class="n">' + D.thoughts.length + '</div><div class="l">思考紀錄</div></div></div>';

  html += '<div class="card viz-card"><div class="viz-head"><h2 style="font-size:15px">心情與睡眠 · 最近 30 天</h2>' +
    '<button class="linklike" id="viz-toggle">' + (chartMode === 'chart' ? '表格檢視' : '圖表檢視') + '</button></div>' +
    '<div class="legend" style="padding:2px 4px 6px"><span class="key"><span class="swatch" style="background:var(--s-mood)"></span>心情</span>' +
    '<span class="key"><span class="swatch" style="background:var(--s-sleep)"></span>睡眠品質</span></div>' +
    '<div id="viz-body"></div></div>';

  html += '<div class="card tight"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px">' +
    '<div><h3>每週自我檢測</h3><div class="mut">PHQ-2（情緒）與 GAD-2（焦慮）</div></div>' +
    '<button class="btn sm" id="hi-assess">開始檢測</button></div>' +
    (D.assessments.length ? '<hr class="divider">' + D.assessments.slice(0, 6).map(a =>
      '<div class="item-row"><div class="grow"><div class="t" style="font-weight:500;font-size:13.5px">' + fmtDate(a.date, true) + '</div></div>' +
      '<span class="badge ' + (a.phq >= 3 ? 'r' : 'g') + '">情緒 ' + a.phq + '</span>' +
      '<span class="badge ' + (a.gad >= 3 ? 'r' : 'g') + '">焦慮 ' + a.gad + '</span></div>').join('') : '') + '</div>';

  html += '<div class="card tight"><h3 style="margin-bottom:6px">思考紀錄</h3>';
  if (!D.thoughts.length) html += '<div class="empty">還沒有紀錄。下次有念頭卡住時，到工具箱寫第一筆。</div>';
  else html += D.thoughts.slice(0, 8).map(t =>
    '<details class="acc" style="box-shadow:none;margin:8px 0"><summary style="font-size:13.5px;padding:10px 12px">' +
    '<span class="grow" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(t.situation.slice(0, 24)) + (t.situation.length > 24 ? '…' : '') + '</span>' +
    '<span class="badge v" style="margin-left:8px">' + t.before + '→' + t.after + '</span><span class="arrow">›</span></summary>' +
    '<div class="acc-body" style="font-size:13.5px;color:var(--ink2)">' +
    '<p style="margin:4px 0"><b>' + fmtDate(t.date, true) + '</b> · 情緒：' + esc(t.emotion || '—') + '（' + t.before + '→' + t.after + '）</p>' +
    '<p style="margin:4px 0">念頭：' + esc(t.thought) + '</p>' +
    (t.distortions.length ? '<p style="margin:4px 0">思考習慣：' + esc(t.distortions.join('、')) + '</p>' : '') +
    (t.balanced ? '<p style="margin:4px 0">平衡想法：' + esc(t.balanced) + '</p>' : '') +
    '</div></details>').join('');
  html += '</div>';

  html += '<div class="card tight"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px">' +
    '<h3 style="margin:0">筆記</h3><button class="btn sm" id="hi-note">新增</button></div>';
  if (!D.notes.length) html += '<div class="empty">還沒有筆記。分頁列右邊那顆 ＋ 隨時可以記一筆。</div>';
  else html += D.notes.slice(0, 8).map(n =>
    '<details class="acc" style="box-shadow:none;margin:8px 0"><summary style="font-size:13.5px;padding:10px 12px">' +
    '<span class="grow" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
    esc(n.text.slice(0, 24)) + (n.text.length > 24 ? '…' : '') + '</span>' +
    '<span class="arrow">›</span></summary>' +
    '<div class="acc-body" style="font-size:13.5px;color:var(--ink2)">' +
    '<p style="margin:4px 0"><b>' + fmtDate(n.date, true) + '</b></p>' +
    '<p style="margin:4px 0;white-space:pre-wrap">' + esc(n.text) + '</p>' +
    '<button class="linklike" data-del-note="' + n.id + '">刪除這筆</button>' +
    '</div></details>').join('');
  html += '</div>';

  v.innerHTML = html;
  $('#hi-assess').addEventListener('click', openAssessment);
  $('#hi-note').addEventListener('click', openQuickNote);
  v.querySelectorAll('[data-del-note]').forEach(btn => btn.addEventListener('click', () => {
    if (!window.confirm('刪除這筆筆記？')) return;
    D.notes = D.notes.filter(n => n.id !== btn.getAttribute('data-del-note'));
    save();
    renderers.history();
  }));
  $('#viz-toggle').addEventListener('click', () => { chartMode = chartMode === 'chart' ? 'table' : 'chart'; renderers.history(); });
  renderViz($('#viz-body'));
};

function renderViz(host) {
  const days = [];
  const d = new Date(); d.setDate(d.getDate() - 29);
  for (let i = 0; i < 30; i++) { days.push(todayKey(d)); d.setDate(d.getDate() + 1); }
  const has = days.some(k => D.checkins[k]);
  if (!has) { host.innerHTML = '<div class="empty">簽到幾天後，這裡會長出你的心情曲線。</div>'; return; }

  if (chartMode === 'table') {
    host.innerHTML = '<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>日期</th><th>心情</th><th>睡眠</th><th>一句話</th></tr></thead><tbody>' +
      days.slice().reverse().filter(k => D.checkins[k]).map(k => {
        const c = D.checkins[k];
        return '<tr><td>' + fmtDate(k, true) + '</td><td>' + esc(c.mood) + '</td><td>' + esc(c.sleep) + '</td><td>' + esc(c.note || '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    return;
  }

  const W = 560, H = 232, padL = 26, padR = 50, padT = 12, padB = 26;
  const x = i => padL + i * (W - padL - padR) / 29;
  const y = val => padT + (10 - val) / 10 * (H - padT - padB);

  const tKeyNow = todayKey();
  const ydDate = new Date(); ydDate.setDate(ydDate.getDate() - 1);
  const yKey = todayKey(ydDate);
  const tc = D.checkins[tKeyNow], yc = D.checkins[yKey];
  let ticker = '';
  if (tc) {
    const dchip = (cur, prevV) => {
      if (typeof prevV !== 'number') return '';
      const df = cur - prevV;
      if (df > 0) return '<span class="delta up">▲ ' + df + '</span>';
      if (df < 0) return '<span class="delta down">▼ ' + Math.abs(df) + '</span>';
      return '<span class="delta flat">—</span>';
    };
    ticker = '<div class="ticker-row"><span>今日心情 <b>' + esc(tc.mood) + '</b> ' + dchip(tc.mood, yc && yc.mood) + '</span>' +
      '<span>睡眠 <b>' + esc(tc.sleep) + '</b> ' + dchip(tc.sleep, yc && yc.sleep) + '</span>' +
      '<span class="mut" style="align-self:center">與昨日相比</span></div>';
  }

  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="最近30天的心情與睡眠品質折線圖">' +
    '<defs><linearGradient id="gmood" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="var(--s-mood)" stop-opacity="0.28"/>' +
    '<stop offset="1" stop-color="var(--s-mood)" stop-opacity="0"/>' +
    '</linearGradient></defs>';
  [0, 5, 10].forEach(g => {
    svg += '<line x1="' + padL + '" y1="' + y(g) + '" x2="' + (W - padR) + '" y2="' + y(g) + '" stroke="var(--grid-line)" stroke-width="1"/>' +
      '<text x="' + (padL - 7) + '" y="' + (y(g) + 4.5) + '" text-anchor="end" font-size="14" fill="var(--ink2)" style="font-variant-numeric:tabular-nums">' + g + '</text>';
  });
  for (let i = 0; i < 30; i += 7) {
    svg += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="14" fill="var(--ink2)">' + fmtDate(days[i]) + '</text>';
  }
  svg += '<line x1="' + padL + '" y1="' + y(0) + '" x2="' + (W - padR) + '" y2="' + y(0) + '" stroke="var(--axis)" stroke-width="1"/>';

  const SERIES = [{ f: 'mood', col: 'var(--s-mood)', lab: '心情', area: true }, { f: 'sleep', col: 'var(--s-sleep)', lab: '睡眠', area: false }];
  SERIES.forEach(s => {
    const segs = []; let seg = [];
    days.forEach((k, i) => {
      const c = D.checkins[k];
      if (c && typeof c[s.f] === 'number') seg.push([x(i), y(c[s.f])]);
      else if (seg.length) { segs.push(seg); seg = []; }
    });
    if (seg.length) segs.push(seg);
    if (s.area) segs.forEach(sg => {
      if (sg.length < 2) return;
      let a = 'M' + sg[0][0].toFixed(1) + ' ' + y(0).toFixed(1);
      sg.forEach(p => { a += 'L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1); });
      a += 'L' + sg[sg.length - 1][0].toFixed(1) + ' ' + y(0).toFixed(1) + 'Z';
      svg += '<path d="' + a + '" fill="url(#gmood)" stroke="none"/>';
    });
    let line = '';
    segs.forEach(sg => { sg.forEach((p, j) => { line += (j ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }); });
    svg += '<path d="' + line + '" fill="none" stroke="' + s.col + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 5px color-mix(in srgb, ' + s.col + ' 55%, transparent))"/>';
    segs.forEach(sg => sg.forEach(p => {
      svg += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.6" fill="' + s.col + '" stroke="var(--bg)" stroke-width="1.6"/>';
    }));
    const lastSeg = segs[segs.length - 1];
    if (lastSeg) {
      const lp = lastSeg[lastSeg.length - 1];
      svg += '<circle cx="' + lp[0].toFixed(1) + '" cy="' + lp[1].toFixed(1) + '" r="7" fill="none" stroke="' + s.col + '" stroke-opacity="0.35" stroke-width="2"/>' +
        '<circle cx="' + lp[0].toFixed(1) + '" cy="' + lp[1].toFixed(1) + '" r="3.4" fill="' + s.col + '" stroke="var(--bg)" stroke-width="1.6"/>' +
        '<text x="' + (lp[0] + 10).toFixed(1) + '" y="' + (lp[1] + 4.5).toFixed(1) + '" font-size="15" fill="var(--ink2)" font-weight="600">' + s.lab + '</text>';
    }
  });
  svg += '</svg>';
  host.innerHTML = ticker + '<div class="viz-wrap">' + svg + '<div class="viz-tip" id="viz-tip"></div></div>';

  const wrap = host.querySelector('.viz-wrap'), tip = wrap.querySelector('#viz-tip'), svgEl = wrap.querySelector('svg');
  svgEl.addEventListener('pointermove', e => {
    const r = svgEl.getBoundingClientRect();
    const vx = (e.clientX - r.left) / r.width * W;
    let i = Math.round((vx - padL) / ((W - padL - padR) / 29));
    i = Math.max(0, Math.min(29, i));
    const c = D.checkins[days[i]];
    if (!c) { tip.style.opacity = 0; return; }
    tip.innerHTML = '<b>' + fmtDate(days[i], true) + '</b><br>心情 ' + esc(c.mood) + ' · 睡眠 ' + esc(c.sleep);
    const topV = Math.min(y(c.mood), y(c.sleep));
    tip.style.left = (x(i) / W * r.width) + 'px';
    tip.style.top = (topV / H * r.height) + 'px';
    tip.style.opacity = 1;
  });
  svgEl.addEventListener('pointerleave', () => { tip.style.opacity = 0; });
}

/* ================= LEARN view ================= */
renderers.learn = function () {
  const v = $('#view-learn');
  const done = Math.min(Object.keys(D.program.completed).length, 28);
  const cur = Math.min(D.program.day, 28);
  let html = '<h1 class="page-title">學習</h1><p class="page-sub">28 天課程 · 已完成 ' + done + ' 課</p>' +
    '<div class="stepper-dots" style="margin:10px 2px 16px">' +
    Array.from({ length: 28 }, (_, i) => '<i class="' + (D.program.completed[i + 1] ? 'done' : '') + '" style="min-width:6px"></i>').join('') + '</div>';

  MODULES.forEach((m, mi) => {
    const mod = CONTENT[m.key];
    const doneN = mod.lessons.filter((_, li) => D.program.completed[mi * 7 + li + 1]).length;
    html += '<details class="acc"' + (Math.floor((cur - 1) / 7) === mi ? ' open' : '') + '><summary>' +
      '<span class="acc-tag">' + m.week + '</span>' + esc(m.name) +
      '<span class="mut" style="font-weight:500;margin-left:auto;padding-right:6px">' + doneN + '/7</span><span class="arrow">›</span></summary><div class="acc-body">' +
      mod.lessons.map((l, li) => {
        const dayN = mi * 7 + li + 1;
        const isDone = !!D.program.completed[dayN], isCur = dayN === cur && !isDone;
        return '<button class="item-row" data-lesson="' + m.key + ':' + li + '" style="width:100%;background:none;border:none;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;color:var(--ink)">' +
          '<span class="badge ' + (isDone ? 'g' : isCur ? 'v' : '') + '" style="' + (isDone || isCur ? '' : 'background:var(--card2);color:var(--muted)') + ';margin-top:2px;min-width:34px;text-align:center">' + (isDone ? '✓' : dayN) + '</span>' +
          '<span class="grow"><span class="t">' + esc(l.title) + '</span>' + (isCur ? '<span class="d" style="color:var(--accent);font-weight:600"> · 今天的課</span>' : '') + '</span></button>';
      }).join('') +
      '<p class="week-label" style="margin-top:12px">本週練習指南</p><div class="chip-row">' +
      mod.exercises.map((e, ei) => '<button type="button" class="chip" data-ex="' + m.key + ':' + ei + '">' + esc(e.name) + '</button>').join('') + '</div>' +
      '</div></details>';
  });

  html += '<details class="acc"><summary><span class="acc-tag">圖鑑</span>認知偏誤 11 種<span class="arrow">›</span></summary><div class="acc-body">' +
    DISTORTIONS.map(d => '<div class="item-row"><div class="grow"><div class="t">' + esc(d.name) + '</div>' +
      '<div class="d" style="color:var(--ink2)">' + esc(d.desc) + '</div><div class="d">' + esc(d.ex) + '</div></div></div>').join('') + '</div></details>';

  html += '<details class="acc"><summary><span class="acc-tag">小卡</span>隨身小技巧<span class="arrow">›</span></summary><div class="acc-body">' +
    MODULES.map(m => '<p class="week-label">' + esc(m.name) + '</p>' +
      CONTENT[m.key].quick_tips.map(t => '<div class="item-row"><span style="color:var(--accent);margin-top:1px">✦</span><div class="grow" style="font-size:13.5px;color:var(--ink2)">' + esc(t) + '</div></div>').join('')).join('') +
    '</div></details>';

  v.innerHTML = html;
  v.querySelectorAll('[data-lesson]').forEach(b => b.addEventListener('click', () => {
    const p = b.dataset.lesson.split(':');
    const l = CONTENT[p[0]].lessons[+p[1]];
    openModal('<h2>' + esc(l.title) + '</h2><p class="body-text">' + esc(l.body) + '</p><hr class="divider">' +
      '<p class="eyebrow">練習 · 5 分鐘內</p><p class="body-text" style="color:var(--ink2)">' + esc(l.practice) + '</p>' +
      '<p class="mut" style="margin-top:14px">在「今日」頁完成當天課程，進度才會前進。</p>');
  }));
  v.querySelectorAll('[data-ex]').forEach(b => b.addEventListener('click', () => {
    const p = b.dataset.ex.split(':');
    const e = CONTENT[p[0]].exercises[+p[1]];
    openModal('<h2>' + esc(e.name) + '</h2><p class="sub">' + esc(e.intro) + '</p>' +
      e.steps.map((s, i) => '<div class="item-row"><span class="badge g" style="margin-top:3px">' + (i + 1) + '</span><div class="grow" style="font-size:14px">' + esc(s) + '</div></div>').join(''));
  }));
};
